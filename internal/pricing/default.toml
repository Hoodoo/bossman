# OpenAI list prices, standard tier, short context (<= 272K input tokens),
# from https://developers.openai.com/api/docs/pricing (checked 2026-10-02).
# Codex sessions stay below 272K: their context window is about 258K.
# OpenAI does not charge extra for cache writes, so they cost input.

