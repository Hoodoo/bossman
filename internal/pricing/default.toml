# bossman pricing table: USD per million tokens.
#
# A session's model id matches the longest key that is a prefix of it, so
# "claude-haiku-4-5" also prices "claude-haiku-4-5-20251001".
# cache_write_5m and cache_write_1h default to 1.25x and 2x input.
# For Codex, cache_read prices OpenAI "cached input" tokens.
#
# Claude Code records its own cost in most sessions; bossman prefers that
# and uses this table only when it is missing. Codex records no cost, so
# its sessions stay unpriced until you add its models here, e.g.
#
#   [models."gpt-5.5"]
#   input = 0.0
#   output = 0.0
#   cache_read = 0.0
#
# Run `bossman prices --init` to copy this file into your bossman home and
# edit it there.

